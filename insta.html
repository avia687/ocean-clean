<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="insta.webmanifest">
<link rel="apple-touch-icon" href="insta-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="אינסטגרם עסקי">
<title>אוקיינוס · עמדת אינסטגרם</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#121c2e;--card2:#18243a;--line:#22324d;--txt:#e8eef7;--mute:#8a9bb5;--acc:#5fd4f0;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,sans-serif;height:100%}
body{display:flex;flex-direction:column;max-width:640px;margin:auto}
header{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-family:'Frank Ruhl Libre',serif;font-size:20px;margin:0;flex:1}
header img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--card2)}
.badge{font-size:11px;padding:3px 8px;border:1px solid var(--acc);color:var(--acc);border-radius:20px}
main{flex:1;overflow-y:auto;padding:12px 16px 90px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;display:flex;background:#0d1626ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:500 12px Heebo;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px}
.dot{position:absolute;top:6px;right:calc(50% - 16px);background:var(--bad);color:#fff;font-size:10px;border-radius:9px;padding:0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#5fd4f0);display:grid;place-items:center;font-weight:700;flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:700}
.sub{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:var(--mute);font-size:11px}
.btn{background:var(--acc);color:#04202a;border:0;border-radius:10px;padding:10px 14px;font:700 14px Heebo}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.red{background:none;color:var(--bad);border:1px solid var(--bad)}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font:15px Heebo}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 5px}
.thread{display:flex;flex-direction:column;gap:6px;padding-bottom:70px}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.4;word-wrap:break-word}
.msg.in{background:var(--card2);align-self:flex-start;border-bottom-right-radius:4px}
.msg.out{background:var(--acc);color:#04202a;align-self:flex-end;border-bottom-left-radius:4px}
.msg .t{display:block;font-size:10px;opacity:.6;margin-top:3px}
.msg img,.msg video{max-width:100%;border-radius:10px;display:block}
.composer{position:fixed;bottom:58px;left:0;right:0;max-width:640px;margin:auto;padding:8px 12px;background:var(--bg);display:flex;gap:8px;border-top:1px solid var(--line)}
.composer input{flex:1}
.back{background:none;border:0;color:var(--acc);font:700 15px Heebo;padding:4px 0 12px}
.warn{font-size:12px;color:#fbbf24;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--card2);position:relative}
.tile img,.tile video{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;bottom:4px;right:6px;font-size:10px;background:#000a;padding:1px 6px;border-radius:6px}
.post{display:flex;gap:10px}
.post img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--card2)}
.cm{border-top:1px solid var(--line);padding:9px 0}
.cm .acts{display:flex;gap:6px;margin-top:6px}
.reply{margin-right:18px;border-right:2px solid var(--acc);padding-right:8px;margin-top:6px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--acc)}
.stat small{color:var(--mute)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:8px;border-radius:8px;font:600 13px Heebo}
.seg button.on{background:var(--acc);color:#04202a}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc);padding:10px 16px;border-radius:10px;z-index:9;font-size:14px;display:none}
ol{padding-right:18px;line-height:1.8;font-size:14px}
a{color:var(--acc)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <img id="pfp" alt="">
  <h1 id="title">עמדת אינסטגרם</h1>
  <button class="btn sm" id="installBtn" style="display:none">התקן</button>
  <span class="badge" id="mode">דמו</span>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
const API='https://graph.instagram.com/v23.0';
const S={token:'',me:null,tab:'dm',demo:true,convs:[],media:[],openConv:null,poll:null};
try{S.token=localStorage.getItem('ig_token')||''}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{if(!t)return'';const d=(Date.now()-new Date(t))/1000;if(d<60)return'עכשיו';if(d<3600)return Math.floor(d/60)+' דק׳';if(d<86400)return Math.floor(d/3600)+' שע׳';return new Date(t).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)};
const ini=n=>(n||'?').replace('@','').slice(0,1).toUpperCase();

async function get(path,params={}){
  const u=new URL(API+path);Object.entries({...params,access_token:S.token}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u);const j=await r.json();if(j.error)throw new Error(j.error.message);return j;
}
async function post(path,params={},method='POST'){
  const b=new URLSearchParams();Object.entries({...params,access_token:S.token}).forEach(([k,v])=>b.set(k,typeof v==='object'?JSON.stringify(v):v));
  const r=await fetch(API+path,{method,body:b});const j=await r.json();if(j.error)throw new Error(j.error.message);return j;
}
const myId=()=>S.me&&(S.me.user_id||S.me.id);

/* ---------- DEMO DATA ---------- */
const DEMO={
  me:{username:'okianus_sofot',name:'אוקיינוס ניקוי ספות',followers_count:1240,follows_count:180,media_count:86,user_id:'me'},
  convs:[
    {id:'c1',updated_time:new Date(Date.now()-120e3).toISOString(),participants:{data:[{id:'me',username:'okianus_sofot'},{id:'u1',username:'dana.levi'}]},
     messages:{data:[{id:'m3',message:'מעולה, מחר ב-10 מתאים?',from:{id:'u1'},created_time:new Date(Date.now()-120e3).toISOString()},{id:'m2',message:'היי דנה! ספה 3 מושבים - 350₪ כולל הכל',from:{id:'me'},created_time:new Date(Date.now()-600e3).toISOString()},{id:'m1',message:'היי, כמה עולה ניקוי ספה תלת?',from:{id:'u1'},created_time:new Date(Date.now()-900e3).toISOString()}]}},
    {id:'c2',updated_time:new Date(Date.now()-5400e3).toISOString(),participants:{data:[{id:'me'},{id:'u2',username:'yossi_k'}]},
     messages:{data:[{id:'m4',message:'אתם מגיעים לאפרת?',from:{id:'u2'},created_time:new Date(Date.now()-5400e3).toISOString()}]}}
  ],
  media:[
    {id:'p1',caption:'לפני ואחרי – ספת בד בהירה 🛋️',media_type:'VIDEO',thumbnail_url:'',timestamp:new Date(Date.now()-86400e3).toISOString(),like_count:84,comments_count:2,
     comments:[{id:'k1',username:'noa.b',text:'וואו איזה הבדל! כמה זה עולה?',timestamp:new Date(Date.now()-3600e3).toISOString(),replies:{data:[]}},{id:'k2',username:'avi_m',text:'מגיעים לירושלים?',timestamp:new Date(Date.now()-7200e3).toISOString(),replies:{data:[{id:'k3',username:'okianus_sofot',text:'כן! שלח וואטסאפ',timestamp:new Date().toISOString()}]}}]}
  ],
  stories:[{id:'s1',media_type:'IMAGE',media_url:'',timestamp:new Date(Date.now()-3*3600e3).toISOString()}]
};

/* ---------- NAV ---------- */
const ICONS={
 dm:'<path d="M4 5h16v11H8l-4 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 cm:'<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="2"/>',
 st:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 2.5"/><circle cx="12" cy="12" r="3" fill="currentColor"/>',
 pub:'<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
 acc:'<circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2"/>'
};
const TABS=[['dm','הודעות'],['cm','תגובות'],['st','סטוריז'],['pub','פרסום'],['acc','חשבון']];
function renderNav(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}${k==='dm'&&unread()?`<span class="dot">${unread()}</span>`:''}</button>`).join('');
}
function unread(){return S.convs.filter(c=>{const m=c.messages?.data?.[0];return m&&m.from?.id!==myId()&&!seen(c)}).length}
function seen(c){try{return localStorage.getItem('seen_'+c.id)===c.updated_time}catch(e){return false}}
function markSeen(c){try{localStorage.setItem('seen_'+c.id,c.updated_time)}catch(e){}}
function go(t){S.tab=t;S.openConv=null;clearInterval(S.poll);renderNav();render()}
function render(){({dm:viewDM,cm:viewCM,st:viewST,pub:viewPub,acc:viewAcc})[S.tab]()}
const loading=()=>$('#view').innerHTML='<div class="empty"><span class="spin"></span></div>';

/* ---------- DM ---------- */
function other(c){return (c.participants?.data||[]).find(p=>p.id!==myId())||{}}
async function loadConvs(){
  if(S.demo){S.convs=DEMO.convs;return}
  const j=await get('/me/conversations',{platform:'instagram',fields:'id,updated_time,participants,messages.limit(1){message,from,created_time}'});
  S.convs=j.data||[];
}
async function viewDM(){
  if(S.openConv)return viewThread();
  loading();
  try{await loadConvs()}catch(e){return err(e)}
  renderNav();
  if(!S.convs.length){$('#view').innerHTML='<div class="empty">אין שיחות</div>';return}
  $('#view').innerHTML=S.convs.map(c=>{const o=other(c),m=c.messages?.data?.[0]||{},un=m.from?.id!==myId()&&!seen(c);
    return`<div class="card row" onclick="openConv('${c.id}')"><div class="av">${ini(o.username)}</div><div class="grow"><div class="name">${esc(o.username||'משתמש')} ${un?'<span style="color:var(--acc)">●</span>':''}</div><div class="sub" style="${un?'color:var(--txt);font-weight:600':''}">${m.from?.id===myId()?'אתה: ':''}${esc(m.message||'📎 קובץ')}</div></div><div class="time">${ago(c.updated_time)}</div></div>`}).join('');
}
function openConv(id){S.openConv=S.convs.find(c=>c.id===id);markSeen(S.openConv);viewThread();renderNav();clearInterval(S.poll);if(!S.demo)S.poll=setInterval(()=>viewThread(true),15000)}
async function viewThread(silent){
  const c=S.openConv,o=other(c);let msgs;
  if(!silent)loading();
  try{
    if(S.demo)msgs=c.messages.data;
    else{const j=await get('/'+c.id,{fields:'messages.limit(30){id,message,from,created_time,attachments{image_data,video_data,file_url}}'});msgs=j.messages?.data||[]}
  }catch(e){return err(e)}
  const last=msgs[0]?.created_time,inWindow=msgs.some(m=>m.from?.id!==myId()&&Date.now()-new Date(m.created_time)<864e5);
  $('#view').innerHTML=`<button class="back" onclick="S.openConv=null;clearInterval(S.poll);viewDM()">→ ${esc(o.username||'שיחה')}</button>
  <div class="thread">${msgs.slice().reverse().map(m=>{const a=m.attachments?.data?.[0];const media=a?(a.video_data?`<video src="${a.video_data.url}" controls></video>`:a.image_data?`<img src="${a.image_data.url}">`:''):'';
    return`<div class="msg ${m.from?.id===myId()?'out':'in'}">${media}${esc(m.message||'')}<span class="t">${ago(m.created_time)}</span></div>`}).join('')}
  ${!inWindow&&!S.demo?'<div class="warn">עברו יותר מ-24 שעות מההודעה האחרונה של הלקוח. אינסטגרם חוסמת מענה מבחוץ, ענה מהאפליקציה.</div>':''}</div>
  <div class="composer"><input id="txt" placeholder="כתוב הודעה…" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" onclick="sendMsg()">שלח</button></div>`;
  window.scrollTo(0,1e6);$('#view').scrollTop=1e6;
}
async function sendMsg(){
  const t=$('#txt').value.trim();if(!t)return;const o=other(S.openConv);
  if(S.demo){S.openConv.messages.data.unshift({id:Date.now(),message:t,from:{id:'me'},created_time:new Date().toISOString()});return viewThread()}
  try{await post('/me/messages',{recipient:{id:o.id},message:{text:t}});viewThread(true)}catch(e){toast('שגיאה: '+e.message)}
}

/* ---------- COMMENTS ---------- */
async function loadMedia(){
  if(S.demo){S.media=DEMO.media;return}
  const j=await get('/me/media',{fields:'id,caption,media_type,media_url,thumbnail_url,permalink,timestamp,like_count,comments_count',limit:15});
  S.media=j.data||[];
}
async function viewCM(){
  loading();try{await loadMedia()}catch(e){return err(e)}
  const withC=S.media.filter(m=>m.comments_count>0);
  if(!withC.length){$('#view').innerHTML='<div class="empty">אין תגובות בפוסטים האחרונים</div>';return}
  $('#view').innerHTML=withC.map(m=>`<div class="card"><div class="post"><img src="${m.thumbnail_url||m.media_url||''}" onerror="this.style.visibility='hidden'"><div class="grow"><div class="sub" style="white-space:normal">${esc((m.caption||'').slice(0,80))}</div><div class="time">❤ ${m.like_count??0} · 💬 ${m.comments_count} · ${ago(m.timestamp)}</div></div></div><div id="c_${m.id}"><span class="spin"></span></div></div>`).join('');
  for(const m of withC)loadComments(m);
}
async function loadComments(m){
  let list;
  try{list=S.demo?m.comments:(await get('/'+m.id+'/comments',{fields:'id,text,username,timestamp,hidden,replies{id,text,username,timestamp}'})).data}catch(e){$('#c_'+m.id).innerHTML=`<div class="warn">${esc(e.message)}</div>`;return}
  $('#c_'+m.id).innerHTML=(list||[]).map(c=>`<div class="cm"><b>${esc(c.username)}</b> <span class="time">${ago(c.timestamp)}</span><div>${esc(c.text)}</div>
   ${(c.replies?.data||[]).map(r=>`<div class="reply"><b>${esc(r.username)}</b> ${esc(r.text)}</div>`).join('')}
   <div class="acts"><button class="btn sm ghost" onclick="replyC('${c.id}','${m.id}')">הגב</button><button class="btn sm ghost" onclick="dmC('${c.id}')">שלח בפרטי</button><button class="btn sm ghost" onclick="hideC('${c.id}','${m.id}',${!c.hidden})">${c.hidden?'הצג':'הסתר'}</button><button class="btn sm red" onclick="delC('${c.id}','${m.id}')">מחק</button></div></div>`).join('');
}
const mediaById=id=>S.media.find(m=>m.id===id);
async function replyC(cid,mid){const t=prompt('תגובה:');if(!t)return;
  if(S.demo){const c=mediaById(mid).comments.find(x=>x.id===cid);c.replies.data.push({username:DEMO.me.username,text:t});return loadComments(mediaById(mid))}
  try{await post('/'+cid+'/replies',{message:t});toast('נשלח');loadComments(mediaById(mid))}catch(e){toast(e.message)}}
async function dmC(cid){const t=prompt('הודעה פרטית למגיב (אפשר רק אחת, עד שיענה):');if(!t)return;
  if(S.demo)return toast('נשלח בפרטי (דמו)');
  try{await post('/me/messages',{recipient:{comment_id:cid},message:{text:t}});toast('נשלח בפרטי')}catch(e){toast(e.message)}}
async function hideC(cid,mid,h){if(S.demo)return toast('דמו');try{await post('/'+cid,{hide:h});loadComments(mediaById(mid))}catch(e){toast(e.message)}}
async function delC(cid,mid){if(!confirm('למחוק את התגובה?'))return;
  if(S.demo){const m=mediaById(mid);m.comments=m.comments.filter(c=>c.id!==cid);return loadComments(m)}
  try{await post('/'+cid,{},'DELETE');toast('נמחק');loadComments(mediaById(mid))}catch(e){toast(e.message)}}

/* ---------- STORIES ---------- */
async function viewST(){
  loading();let st;
  try{st=S.demo?DEMO.stories:(await get('/me/stories',{fields:'id,media_type,media_url,thumbnail_url,timestamp,permalink'})).data}catch(e){return err(e)}
  $('#view').innerHTML=`<div class="sub" style="margin-bottom:10px;white-space:normal">הסטוריז הפעילים שלך (24 שעות אחרונות). סטוריז של אחרים לא זמינים באינסטגרם הרשמי.</div>`+
  (st?.length?`<div class="grid">${st.map(s=>`<a class="tile" href="${s.permalink||'#'}" target="_blank">${s.media_type==='VIDEO'?`<video src="${s.media_url||''}" muted playsinline preload="metadata"></video>`:`<img src="${s.media_url||''}" onerror="this.style.visibility='hidden'">`}<span>${ago(s.timestamp)}</span></a>`).join('')}</div>`:'<div class="empty">אין סטורי פעיל כרגע</div>')+
  `<button class="btn" style="width:100%;margin-top:14px" onclick="S.pubType='STORIES';go('pub')">+ סטורי חדש</button>`;
}

/* ---------- PUBLISH ---------- */
S.pubType='STORIES';
function viewPub(){
  const t=S.pubType;
  $('#view').innerHTML=`<div class="seg">${[['STORIES','סטורי'],['REELS','רילס'],['IMAGE','פוסט']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="S.pubType='${k}';viewPub()">${l}</button>`).join('')}</div>
  <label>קישור ציבורי לקובץ (תמונה או סרטון)</label><input id="murl" placeholder="https://…/video.mp4" dir="ltr">
  <div class="sub" style="white-space:normal;margin-top:4px">אינסטגרם מורידה את הקובץ מקישור ציבורי (למשל קישור ישיר מ-GitHub או Dropbox עם ‎?dl=1). ${t==='STORIES'?'סרטון סטורי עד 8MB, בלי סטיקרים.':''}</div>
  ${t!=='STORIES'?'<label>כיתוב</label><textarea id="cap"></textarea>':''}
  <button class="btn" style="width:100%;margin-top:14px" id="pubBtn" onclick="publish()">פרסם עכשיו</button><div id="pubLog" class="sub" style="margin-top:10px;white-space:normal"></div>`;
}
async function publish(){
  const url=$('#murl').value.trim(),cap=$('#cap')?.value||'',t=S.pubType,log=m=>$('#pubLog').innerHTML=m;
  if(!url)return toast('חסר קישור');
  if(S.demo)return log('✓ פורסם (דמו)');
  const isVid=/\.(mp4|mov)(\?|$)/i.test(url)||t==='REELS';
  const p={};if(t!=='IMAGE')p.media_type=t;p[isVid?'video_url':'image_url']=url;if(cap)p.caption=cap;
  $('#pubBtn').disabled=true;
  try{
    log('<span class="spin"></span> מעלה לאינסטגרם…');
    const c=await post('/me/media',p);
    for(let i=0;i<40;i++){const s=await get('/'+c.id,{fields:'status_code'});if(s.status_code==='FINISHED')break;if(s.status_code==='ERROR')throw new Error('אינסטגרם דחתה את הקובץ (פורמט/גודל)');log(`<span class="spin"></span> מעבד… (${i*5} שנ׳)`);await new Promise(r=>setTimeout(r,5000))}
    await post('/me/media_publish',{creation_id:c.id});log('✓ פורסם!');toast('פורסם ✓');
  }catch(e){log('<span style="color:var(--bad)">'+esc(e.message)+'</span>')}
  $('#pubBtn').disabled=false;
}

/* ---------- ACCOUNT ---------- */
function viewAcc(){
  const m=S.me||{};
  $('#view').innerHTML=(S.me?`<div class="card"><div class="row"><div class="av">${ini(m.username)}</div><div class="grow"><div class="name">@${esc(m.username)}</div><div class="sub">${esc(m.name||'')}</div></div></div>
   <div class="stats" style="margin-top:12px"><div class="stat"><b>${m.followers_count??'–'}</b><small>עוקבים</small></div><div class="stat"><b>${m.follows_count??'–'}</b><small>נעקבים</small></div><div class="stat"><b>${m.media_count??'–'}</b><small>פוסטים</small></div></div></div>`:'')+
  `<div class="card"><div class="name">${S.demo?'חיבור החשבון':'טוקן מחובר ✓'}</div>
  ${S.demo?`<ol>
   <li>באפליקציית אינסטגרם: הגדרות ← הודעות ותשובות לסטורי ← כלים מחוברים ← <b>אפשר גישה להודעות</b>.</li>
   <li>היכנס ל-<a href="https://developers.facebook.com/apps" target="_blank">developers.facebook.com/apps</a> ← צור אפליקציה ← סוג Business ← הוסף מוצר Instagram.</li>
   <li>ב-"API setup with Instagram login" ← <b>Add account</b> ← התחבר ל-@okianus_sofot ← <b>Generate token</b>.</li>
   <li>העתק והדבק כאן:</li></ol>`:''}
  <input id="tok" dir="ltr" placeholder="IGAA…" value="${S.demo?'':'••••••••'}">
  <div class="row" style="margin-top:10px;gap:8px"><button class="btn" onclick="saveTok()">${S.demo?'התחבר':'החלף טוקן'}</button>${S.demo?'':'<button class="btn ghost" onclick="refreshTok()">חדש תוקף (60 יום)</button><button class="btn red" onclick="logout()">נתק</button>'}</div></div>`;
}
async function saveTok(){const v=$('#tok').value.trim();if(!v||v.startsWith('•'))return;S.token=v;try{localStorage.setItem('ig_token',v)}catch(e){}await boot()}
async function refreshTok(){try{const r=await fetch(`https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${S.token}`);const j=await r.json();if(j.error)throw new Error(j.error.message);S.token=j.access_token;localStorage.setItem('ig_token',S.token);toast('התוקף חודש ל-60 יום')}catch(e){toast(e.message)}}
function logout(){S.token='';try{localStorage.removeItem('ig_token')}catch(e){}boot()}
function err(e){$('#view').innerHTML=`<div class="card"><div style="color:var(--bad)">שגיאה</div><div class="sub" style="white-space:normal">${esc(e.message)}</div><button class="btn sm ghost" style="margin-top:8px" onclick="go('acc')">בדוק חיבור</button></div>`}

/* ---------- BOOT ---------- */
async function boot(){
  if(S.token){
    try{S.me=await get('/me',{fields:'user_id,username,name,profile_picture_url,followers_count,follows_count,media_count'});S.demo=false;
      if(Date.now()-(+localStorage.getItem('tok_ref')||0)>7*864e5){refreshTok();localStorage.setItem('tok_ref',Date.now())}
    }catch(e){toast('הטוקן לא תקין: '+e.message);S.demo=true;S.me=DEMO.me;S.tab='acc'}
  }else{S.demo=true;S.me=DEMO.me}
  $('#mode').textContent=S.demo?'דמו':'מחובר';$('#mode').style.borderColor=$('#mode').style.color=S.demo?'#fbbf24':'var(--ok)';
  $('#title').textContent='@'+(S.me?.username||'');if(S.me?.profile_picture_url)$('#pfp').src=S.me.profile_picture_url;
  if(!S.demo&&S.tab==='acc')S.tab='dm';
  renderNav();render();
  if(!S.demo){loadConvs().then(renderNav).catch(()=>{});setInterval(()=>{if(S.tab==='dm'&&!S.openConv)viewDM();else loadConvs().then(renderNav).catch(()=>{})},60000)}
}
/* ---------- INSTALL ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('insta-sw.js',{scope:'./insta'}).catch(()=>{});
let deferredInstall;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').style.display='inline-block'});
$('#installBtn').onclick=async()=>{if(deferredInstall){deferredInstall.prompt();deferredInstall=null;$('#installBtn').style.display='none'}else toast('באייפון: שיתוף ← הוסף למסך הבית')};
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(!standalone&&/iphone|ipad/i.test(navigator.userAgent)){$('#installBtn').style.display='inline-block'}
boot();
</script>
